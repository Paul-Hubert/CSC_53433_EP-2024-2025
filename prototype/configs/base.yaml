# Starting values from plan §A4. Tuned in S2.6 — record changes in STATUS.md.
seed: 1234
world:
  # Lab 1 (2026-10-01): a flat world. No water and no mountains, so every cell is
  # walkable and food appears uniformly at random. The terrain and foliage labs change
  # this; configs/worlds/terrain_preview.yaml shows the built-in noise terrain.
  width: 96                    # 64 x 64 until 2026-10-07 (owner: a bigger world, more predators)
  height: 96
  water_fraction: 0.0          # share of cells that are water (impassable)
  mountain_fraction: 0.0       # share of cells that are mountain (impassable)
  noise_octaves: [16, 8, 4]    # heightmap noise, used only when a fraction above is > 0
  min_walkable_connected: 0.60
  food_initial_fraction: 0.08
  food_regrow_p: 0.0007       # chance per empty cell per tick; tuned 2026-10-01 for the flat world (food-limited, below cap)
  food_water_bonus: 2.0        # regrowth multiplier near water (no effect without water)
  water_bonus_radius: 3
perception:                   # both species (rev. 2026-10-07)
  bands: [1, 4, 10]           # distance bands in cells: adjacent <= 1, close <= 4, medium <= 10, far <= vision
  partner_range: 20           # cells within which an animal sees whether the nearest other one of its kind is ready to mate (4 until 2026-10-07)
agents:                       # the prey animals
  init_pop: 68                # 30 and 60 in the 64 x 64 world; scaled by area
  floor: 10
  cap: 135
  vision: 20                  # cells (Chebyshev); was 12 with only near/far until 2026-10-07
  energy_max: 100.0
  energy_start: 60.0
  cost_base: 0.7
  cost_move: 0.5              # per cell moved
  cost_rest: 0.2
  speed: 1                    # cells per tick when running (flee); every other move walks 1 cell
  stamina_max: 60.0           # stamina (since 2026-10-07) = cells an animal can move before it must stop; 1 per cell
  stamina_regen: 2.0          # stamina back per tick without moving
  cost_regen: 0.3             # extra energy per tick without moving, until stamina is full
  stamina_low: 20.0           # observation: low < 20 <= medium <= 40 < high
  stamina_high: 40.0
  eat_gain: 25.0
  maturity: 150
  max_age: 1500
  mate_energy: 50.0
  child_energy: 40.0
  energy_low: 30.0
  energy_high: 70.0
  wander_turn_p: 0.25         # random walk of an animal whose chosen action has nothing in sight
predators:                    # genetic animals like the prey since 2026-10-07: genes, LLM brain, energy, breeding.
                              # kill_p and digest_ticks tuned 2026-10-07 (keyword brain, 4 seeds): both species coexist
  init_pop: 14                # 6 and 15 in the 64 x 64 world; scaled by area
  floor: 3                    # newcomers from the predator founder pool below this
  cap: 34
  vision: 20                  # same as the prey
  energy_max: 100.0
  energy_start: 60.0
  cost_base: 0.7
  cost_move: 0.5              # per cell moved
  cost_rest: 0.2
  speed: 2                    # cells per tick when hunting (faster than the prey); every other move walks 1 cell
  stamina_max: 30.0           # half the prey's: 15 ticks of running
  stamina_regen: 2.0
  cost_regen: 0.3
  stamina_low: 10.0
  stamina_high: 20.0
  kill_p: 0.1                 # chance that a strike kills; a hunting predator strikes when next to its prey
  kill_gain: 60.0             # energy from one kill
  digest_ticks: 50            # after a kill the predator stays still and doesn't decide; after a carcass portion, in proportion (30 → 25 ticks)
  carcass_portions: 2         # a kill leaves a carcass: one portion each for up to 2 other predators (0 = no carcass)
  carcass_gain: 30.0          # energy per portion
  carcass_ticks: 100          # a carcass rots away after this many ticks
  maturity: 150
  max_age: 1500
  mate_energy: 50.0
  child_energy: 40.0
  energy_low: 30.0
  energy_high: 70.0
  wander_turn_p: 0.25
sim:
  decision_period: 4
  sampling_temperature: 1.0
  stats_every: 100
evolution:
  sexual: true
  p_mut: 0.03                 # chance per gene per child that the mutator LLM changes it
  shuffled: false             # C3 control
  random_founders: false      # C4 control
  # Mutation (rev. 2026-10-02): one operator. The mutator LLM (mutator.model) gets one
  # instruction drawn at random from this file plus the gene sentence, nothing else.
  # Rev. 2026-10-08: small edits of the rule (v4; v2 = random word edits) after a fixed context line.
  mutation_prompts: prompts/mutate_v4.txt
  mutation_context: "The sentence below is a rule that a wild animal follows."   # same for every gene (null: none)
  temperature: 1.2            # mutator sampling temperature (results/mutation_test.md)
  max_words: 12               # guard: longer answers are rejected
  mutation_tries: 5           # a rejected answer is drawn again (new instruction and seed), up to 5 attempts
backend:
  name: rule_based            # random | rule_based | llm | jev | laya (parked)
  obs_style: V1
policy:                       # LLM decision backend (default brain, rev. 2026-09-30)
  model: gemma4:12b           # chosen 2026-10-01 (gate 12b vs 26b, local RTX 5080); or a cloud model tag
  mode: points                # points (default) | logprobs (1 token/decision, if Ollama returns
                              # logprobs — probe S1.3) | table (fewer requests but ~4-6x more
                              # generated answers via prefetch; only for request-limited cloud) | ksample
  table_k: 8
  workers: 2                  # parallel requests (match OLLAMA_NUM_PARALLEL / cloud limits)
  prompt: prompts/teacher_v5.md            # prey
  predator_prompt: prompts/predator_v3.md
jev:                          # --backend jev (rev. 2026-10-08): JEV-9B System 1 (LoRA + 24-slot head) served by
                              # vLLM (docker/compose.yaml); one prefill pass per decision; reads policy.prompt /
                              # policy.predator_prompt
  host: http://localhost:8000 # OpenAI-compatible server (any machine: change only this)
  served_model: jev-decision  # the LoRA module name given to vLLM (--lora-modules)
  repo: autotrust/JEV-9B      # NOT prithivMLmods/JEV-9B-GGUF: those files are the bare Qwen3.5-9B backbone
  revision: b63f651ce8ed64481d3f5e73ecdb05f740042f01   # pinned 2026-10-08 (decision_head.json, calibration.json)
  max_tokens: 1024            # training length; longer inputs are counted (too_long), not cut
  timeout_s: 60
  api_key_env: null           # name of an env var holding a key, if the server needs one
mutator:                      # gene mutation (rev. 2026-10-08): a small model; mutations are meant to be random
  api: ollama                 # ollama | openai (an OpenAI-compatible server, e.g. vLLM)
  host: http://localhost:11434   # its own address, independent of jev.host
  model: qwen3.5:0.8b         # null = no mutation (before 2026-10-08: gemma4:12b on the GPU)
  timeout_s: 60
  api_key_env: null
  options: {num_gpu: 0, num_ctx: 1024}   # ollama: on the CPU, the GPU is JEV's (FP8 needs nearly all of it)
  think: false                # ollama: Qwen3.5 thinks by default
  extra: {chat_template_kwargs: {enable_thinking: false}}   # openai: sent with every request
laya:
  checkpoint: convaiinnovations/laya   # or subfolder multilingual (decided in S1.5)
  subfolder: null
  placement: P4
  device: null                # null = library default
  head_max_len: {english: 192, multilingual: 256}   # model card; S1.2 confirms
  tokenizer: {english: answerdotai/ModernBERT-large, multilingual: jhu-clsp/mmBERT-base}  # fallback for e0_budget
ollama:
  host: http://localhost:11434   # or https://ollama.com (direct cloud API, needs a key)
  api_key_env: OLLAMA_API_KEY    # name of the env var holding the key; sent only if set
  teacher_model: null         # chosen in S1.3
  embed_model: null
  teacher_mode: points        # points | ksample
  ksample_k: 8
  timeout_s: 120
  options: {num_ctx: 4096}    # fixed context: avoids model reloads and CPU spill (gemma4 default 256k)
  think: false                # thinking models (gemma4, qwen3...) otherwise reason before the JSON; null = server default
paths:
  cache_dir: cache
  data_dir: data
  results_dir: results
  logs_dir: logs
